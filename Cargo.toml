[package]
name = "iced_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rpassword = "7"
arboard = "3"
dirs = "5"
zeroize = { version = "1", features = ["zeroize_derive"] }

[build-dependencies]
winres = "0.1"
